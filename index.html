<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微生物拉丁名卡片 · MicroCards</title>
<meta name="theme-color" content="#0f1729">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MicroCards">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favicon">
<link rel="manifest" id="manifestLink">
<style>
:root{
  --bg:#f2f5fa; --bg2:#e8eef7; --card:#ffffff; --ink:#16233a; --ink2:#5a6b85; --ink3:#8a99ae;
  --line:#e2e8f0; --pri:#2b6fe0; --pri-soft:#e8f0ff;
  --b:#2f6fd0; --f:#12896c; --v:#7c4ddb; --p:#d97a17;
  --ok:#12a06a; --warn:#e0a008; --bad:#e0543f;
  --act:#0e9aa1; --arc:#9b4ddb; --cyan:#1f8fb0; --yeast:#e08a17; --mold:#a9743b; --basid:#7a9a3a; --algae:#1f9d6b;
  --shadow:0 10px 30px rgba(20,40,80,.10),0 2px 8px rgba(20,40,80,.06);
  --r:18px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1729; --bg2:#131d33; --card:#1a2439; --ink:#e8eef8; --ink2:#a3b1c8; --ink3:#6f7f97;
    --line:#27324a; --pri:#5b95f5; --pri-soft:#1c2c49;
    --b:#5b95f5; --f:#2fb894; --v:#a683ee; --p:#f0a24a;
    --act:#43c4c0; --arc:#c08bef; --cyan:#4fb4d4; --yeast:#f0a24a; --mold:#cba06a; --basid:#a9c463; --algae:#5fd49b;
    --shadow:0 12px 34px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-t)}

/* ---------- header ---------- */
header{
  flex:0 0 auto;padding:10px 16px 8px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,var(--bg) 70%,transparent);
}
.logo{font-size:17px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.logo small{font-weight:600;color:var(--ink3);font-size:11px;margin-left:6px}
.hdr-sp{flex:1}
.iconbtn{
  width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--ink)
}
.ring{position:relative;width:36px;height:36px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--ink2)}

/* ---------- views ---------- */
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 100px;display:none}
.view.on{display:block}

/* ---------- card stack ---------- */
#study{display:none;flex-direction:column;overflow:hidden;padding:0}
#study.on{display:flex;min-height:0}
.stackWrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 16px 22px;min-height:0}
.stack{position:relative;width:100%;max-width:420px;height:100%;max-height:432px;min-height:0}
.card{
  position:absolute;inset:0;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);
  overflow:hidden;will-change:transform;touch-action:none;
  transition:transform .28s cubic-bezier(.2,.8,.3,1),opacity .28s;
  border:1px solid var(--line);
}
.card.drag{transition:none}
.card .inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,.1,.2,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  padding:18px;display:flex;flex-direction:column;overflow-y:auto;
}
.face.back{transform:rotateY(180deg)}
.stripe{height:4px;border-radius:99px;width:46px;margin-bottom:12px}
.gbact{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--pri-soft);color:var(--pri);align-self:flex-start}
.latin{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(21px,6.6vw,30px);line-height:1.22;font-weight:600;margin:14px 0 4px;word-break:break-word}
.latin .sp{font-style:normal;font-weight:400;opacity:.75}
.zhname{font-size:clamp(17px,4.8vw,21px);font-weight:800;margin:2px 0 0;letter-spacing:.5px}
.alias{font-size:12px;color:var(--ink3);margin-top:3px}
.rowlab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:1.2px;margin-top:16px}
.syl{font-size:14px;line-height:1.9;background:var(--bg2);border-radius:12px;padding:9px 11px;margin-top:7px;letter-spacing:.2px;font-family:Georgia,serif}
.syl b{color:var(--bad);font-weight:700;text-transform:none}
.ph{font-size:14px;line-height:1.9;margin-top:7px;color:var(--ink2)}
.ph b{color:var(--bad);font-weight:800}
.spk{font-size:12px;color:var(--pri);border:none;background:transparent;font-weight:700;cursor:pointer;padding:0}
.spacer{flex:1}
.fcenter{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.hint{font-size:11px;color:var(--ink3);text-align:center;padding:8px 0 2px}
/* 学习时先藏答案，评分后才揭晓 */
.ans.hidden{display:none}
.ans-lock{display:none;margin-top:10px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:14px;
  text-align:center;color:var(--ink3);font-size:13px;line-height:1.6;background:var(--bg2)}
.ans-lock.show{display:block}
.ctrl.done{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.nextRow{display:none;flex:0 0 auto;gap:12px;justify-content:center;align-items:center;padding:10px 16px 0}
.nextRow.show{display:flex}
.nextRow .btn{flex:0 0 auto;min-width:160px;max-width:220px;height:54px;margin:0;font-size:16px;font-weight:800;
  padding:0 28px;border-radius:15px;justify-content:center;box-shadow:0 4px 14px rgba(20,40,80,.10)}
.nextRow .btn:disabled{opacity:.55;box-shadow:none}
.btn.btnNext{display:flex;flex:0 0 auto;min-width:160px;max-width:220px;height:54px;margin:0;font-size:16px;
  font-weight:800;padding:0 28px;border-radius:15px;justify-content:center}
.sec{margin-top:14px}.sec h4{margin:0 0 5px;font-size:12px;color:var(--ink3);letter-spacing:1px}
.sec p{margin:0;font-size:14px;line-height:1.65;color:var(--ink)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;padding:4px 8px;border-radius:8px;background:var(--bg2);color:var(--ink2);font-weight:600}
.mnbox{margin-top:14px;background:var(--pri-soft);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--ink)}
.mnbox b{color:var(--pri)}
.fav{position:absolute;right:12px;top:12px;font-size:20px;cursor:pointer;z-index:5;line-height:1}

/* ---------- controls ---------- */
.ctrl{flex:0 0 auto;display:flex;gap:8px;padding:6px 16px calc(10px + var(--safe-b));justify-content:center}
.btn{
  flex:1;max-width:130px;border:1px solid var(--line);background:var(--card);border-radius:14px;
  padding:11px 4px;font-size:12px;font-weight:800;color:var(--ink2);cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;box-shadow:0 2px 6px rgba(20,40,80,.05)
}
.btn i{font-style:normal;font-size:17px}
.btn:active{transform:scale(.96)}
.btn.bad{color:var(--bad)} .btn.warn{color:var(--warn)} .btn.ok{color:var(--ok)}
.btn.pri{background:var(--pri);color:#fff;border-color:transparent}
.mini{display:flex;justify-content:center;gap:8px;padding:0 16px 8px}
.mini button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:99px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}

/* ---------- common ---------- */
.cardbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.ttl{font-size:13px;font-weight:800;color:var(--ink3);letter-spacing:1px;margin:16px 0 8px}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 13px;font-size:14px;color:var(--ink);outline:none}
.filters{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.fbtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;white-space:nowrap}
.fbtn.on{background:var(--pri);color:#fff;border-color:transparent}
.item{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:none}
.item .l{font-family:Georgia,serif;font-style:italic;font-size:15px;font-weight:600}
.item .z{font-size:12px;color:var(--ink3);margin-top:2px}
.dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto}
.star{font-size:16px;flex:0 0 auto;cursor:pointer}
.empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:14px;line-height:1.8}
.big{font-size:34px;font-weight:900;letter-spacing:-.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .n{font-size:22px;font-weight:900}
.stat .t{font-size:11px;color:var(--ink3);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.prow{margin-bottom:12px}
.prow .pl{display:flex;justify-content:space-between;font-size:12px;font-weight:700}

/* ---------- quiz ---------- */
.qwrap{max-width:420px;margin:0 auto}
.qprog{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:10px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;box-shadow:var(--shadow);text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.qword{font-family:Georgia,serif;font-style:italic;font-size:26px;font-weight:600;line-height:1.3}
.qword:not(.i){font-family:inherit;font-style:normal;font-weight:800}
.qsub{font-size:12px;color:var(--ink3);margin-top:8px}
.opts{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;font-size:15px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt.right{background:rgba(18,160,106,.13);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:rgba(224,84,63,.13);border-color:var(--bad);color:var(--bad)}
.opt.dim{opacity:.45}

/* ---------- nav ---------- */
nav{
  flex:0 0 auto;display:flex;border-top:1px solid var(--line);background:var(--card);
  padding-bottom:var(--safe-b)
}
nav div{flex:1;padding:8px 0 7px;text-align:center;font-size:10px;color:var(--ink3);font-weight:700;cursor:pointer}
nav div i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
nav div.on{color:var(--pri)}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:flex-end;justify-content:center;z-index:99}
.mask.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + var(--safe-b));max-height:88vh;overflow-y:auto}
.sheet h3{margin:2px 0 14px;font-size:16px}
.fld{margin-bottom:11px}
.fld label{font-size:11px;font-weight:800;color:var(--ink3);display:block;margin-bottom:5px}
.fld input,.fld textarea,.fld select{
  width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;
  font-size:14px;color:var(--ink);outline:none;font-family:inherit
}
.fld textarea{min-height:64px;resize:vertical;user-select:text;-webkit-user-select:text}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;font-size:14px;font-weight:600}
.sw input{width:44px;height:26px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:99px;position:relative;transition:.2s;cursor:pointer}
.sw input:checked{background:var(--pri)}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:99px;background:#fff;transition:.2s}
.sw input:checked::after{left:21px}
.row2{display:flex;gap:9px}
.row2 .btn{max-width:none}
.closebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.closebar b{font-size:16px}
.x{font-size:22px;color:var(--ink3);cursor:pointer;line-height:1}
.toast{position:fixed;left:50%;top:calc(62px + var(--safe-t));transform:translateX(-50%) translateY(-12px);background:rgba(20,35,60,.94);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:200;max-width:80%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.tagline{font-size:11px;color:var(--ink3);text-align:center;margin-top:14px;line-height:1.7}

@media (max-width:360px){
  .logo small{display:none}
  .logo{font-size:16px}
  header{gap:6px}
}
@media (max-height:700px){
  .hint{display:none}
  header{padding:6px 14px 4px}
  .ctrl{padding:4px 14px calc(8px + var(--safe-b))}
  .btn{padding:9px 4px;font-size:11px}
  .nextRow .btn,.btn.btnNext{font-size:14px;height:46px;min-width:120px;padding:0 20px}
  .face{padding:14px}
  .latin{font-size:19px;margin:10px 0 2px}
  .zhname{font-size:16px}
  .rowlab{margin-top:10px;font-size:10px;letter-spacing:1px}
  .syl{font-size:12.5px;padding:7px 9px;margin-top:5px}
  .ph{font-size:12.5px;margin-top:5px}
  .sec{margin-top:10px}
  .sec p{font-size:13px;line-height:1.55}
  .mnbox{font-size:12px;padding:8px 10px;margin-top:10px}
}
@media (max-height:600px){
  .stackWrap{padding:2px 12px 14px}
  .latin{font-size:17.5px}
  .zhname{font-size:15px}
  .stripe{height:3px;width:36px;margin-bottom:8px}
  .gbact{font-size:10px;padding:3px 7px}
  .ctrl .btn i{font-size:15px}
}
/* ---------- 词书 ---------- */
.booktag{font-size:12px;font-weight:800;color:var(--ink2);text-align:center;padding:8px 0 2px;letter-spacing:.5px}
.book{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.book .b-bar{height:6px;border-radius:99px;margin:-14px -16px 12px;background:var(--bg2)}
.book .b-row{display:flex;align-items:center;gap:9px}
.book .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.book .b-name{font-size:16px;font-weight:800}
.book .b-count{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:700}
.book .b-sub{font-size:12px;color:var(--ink2);margin-top:6px}
.book .b-go{justify-content:center}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="logo">MicroCards<small>微生物拉丁名</small></div>
    <div class="hdr-sp"></div>
    <div class="ring" id="ring"><svg width="36" height="36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line)" stroke-width="4"/><circle id="ringFg" cx="18" cy="18" r="15" fill="none" stroke="var(--pri)" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="94.2"/></svg><span class="num" id="ringNum">0</span></div>
    <div class="iconbtn" id="btnSearch" title="搜微生物拉丁名">🔍</div>
    <div class="iconbtn" id="btnSet">⚙</div>
  </header>

  <main>
    <!-- STUDY -->
    <section id="study" class="view on">
      <div class="booktag" id="bookTag">全部词书</div>
      <div class="stackWrap">
        <div class="stack" id="stack"></div>
      </div>
      <div class="hint" id="hint">先回想中文名 · 选「会了/模糊/不会」揭晓 · 滑动进下一张</div>
      <div class="ctrl">
        <div class="btn bad" data-g="0"><i>✕</i>不会</div>
        <div class="btn warn" data-g="3"><i>◐</i>模糊</div>
        <div class="btn ok" data-g="5"><i>✓</i>认识</div>
      </div>
      <div class="nextRow" id="nextRow">
        <button class="btn" id="btnWrong">✗ 记错了</button>
        <button class="btn btnNext" id="btnNext">下一张 →</button>
      </div>
    </section>

    <!-- BOOKS -->
    <section id="books" class="view">
      <div class="ttl">选择词书</div>
      <div id="bookList"></div>
      <div class="tagline">每本词书独立记录掌握进度 · 词条由 AI 整理，请以诸葛健《微生物学》（第二版）教材为准</div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" class="view">
      <div class="qwrap">
        <div class="row2" style="margin-bottom:12px">
          <button class="btn pri" id="qStart" style="max-width:none">开始测验</button>
          <button class="btn" id="qMode" style="max-width:none;flex:0 0 130px">拉 → 中</button>
        </div>
        <div id="qBody"></div>
      </div>
    </section>

    <!-- LIB -->
    <section id="lib" class="view">
      <input class="search" id="q" placeholder="搜拉丁名 / 中文名；查不到点「🌐 联网查」——拉丁、中文俗名、英文名都行…">
      <div class="filters" id="filters"></div>
      <div class="ttl" id="libCount"></div>
      <div class="cardbox" id="list" style="padding:0"></div>
      <div style="text-align:center;margin-top:14px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
        <button class="btn pri" id="btnStudyFilter" style="display:inline-flex;max-width:220px">▶ 用当前筛选练习</button>
        <button class="btn" id="btnAdd" style="display:inline-flex;max-width:200px">＋ 添加词条</button>
        <button class="btn" id="btnOnline" style="display:inline-flex;max-width:200px">🌐 联网查</button>
      </div>
      <div class="tagline">点击词条查看详情，可一键跳到卡片背诵 / 右侧 ★ 收藏</div>
    </section>

    <!-- STATS -->
    <section id="stats" class="view">
      <div class="grid3" id="sTop"></div>
      <div class="ttl">掌握进度</div>
      <div class="cardbox" id="sProg"></div>
      <div class="ttl">今日计划</div>
      <div class="cardbox" id="sToday"></div>
      <div class="ttl">数据管理</div>
      <div class="cardbox">
        <div class="row2">
          <button class="btn" id="btnExport">⬇ 导出备份</button>
          <button class="btn" id="btnImport">⬆ 导入备份</button>
        </div>
        <div class="row2" style="margin-top:9px">
          <button class="btn" id="btnCsv">⇪ CSV 导入词条</button>
          <button class="btn bad" id="btnReset">⟲ 重置进度</button>
        </div>
        <input type="file" id="fileIn" accept=".json,.csv,text/csv" style="display:none">
      </div>
      <div class="tagline">进度保存在本机浏览器，清理浏览器数据会丢失，建议定期导出备份</div>
    </section>
  </main>

  <nav>
    <div data-v="books"><i>📖</i>词书</div>
    <div class="on" data-v="study"><i>🃏</i>学习</div>
    <div data-v="quiz"><i>🎯</i>测验</div>
    <div data-v="lib"><i>📚</i>词库</div>
    <div data-v="stats"><i>📊</i>统计</div>

const GROUPS = {细菌:"var(--b)",放线菌:"var(--act)",古菌:"var(--arc)",蓝细菌:"var(--cyan)",酵母菌:"var(--yeast)",霉菌:"var(--mold)",担子菌:"var(--basid)",藻类:"var(--algae)",病毒:"var(--v)"};
const GKEYS  = ["细菌","放线菌","古菌","蓝细菌","酵母菌","霉菌","担子菌","藻类","病毒"];
const K_STATE="mmc_state_v1", K_CUSTOM="mmc_custom_v1", K_SET="mmc_set_v1", K_MISC="mmc_misc_v1";

/* ============ 状态 ============ */
let S = load(K_STATE,{});
let CUSTOM = load(K_CUSTOM,[]);
let SET = Object.assign({autoSpeak:false, rate:0.85, newLimit:20, shuffle:false, ai:{on:false,base:"",key:"",model:""}}, load(K_SET,{}));
if(!SET.ai) SET.ai={on:false,base:"",key:"",model:""};
let MISC = Object.assign({todayNew:0, lastDate:strDate(Date.now())}, load(K_MISC,{}));

function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function strDate(t){const d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function p2(n){return n<10?"0"+n:""+n}
function today(){const s=strDate(Date.now());if(MISC.lastDate!==s){MISC.lastDate=s;MISC.todayNew=0;save(K_MISC,MISC)}return s}

let ALL = [];
function rebuild(){ ALL = DATA.concat(CUSTOM); ALL.forEach((d,i)=>{ if(!d.id) d.id = "k"+i+"_"+(d.la||"").slice(0,6); }); }
rebuild();

function st(id){
  if(!S[id]) S[id] = {ef:2.5, reps:0, iv:0, due:0, fav:0, seen:0, wrong:0, right:0};
  return S[id];
}
/* SM-2 */
function review(id, q){
  today();
  const s = st(id); const now = Date.now();
  if(s.seen===0){ MISC.todayNew++; save(K_MISC,MISC); }
  if(q<3){ s.reps=0; s.iv=0; s.due=now+5*60*1000; s.wrong++; }
  else{
    s.reps++;
    if(s.reps===1) s.iv=1;
    else if(s.reps===2) s.iv=6;
    else s.iv=Math.max(1,Math.round(s.iv*s.ef));
    s.ef = Math.min(2.5, Math.max(1.3, s.ef + (0.1-(5-q)*(0.08+(5-q)*0.02))));
    s.due = now + s.iv*86400000;
    if(q>=5) s.right++;
  }
  s.seen++; if(!s.seen) s.seen=1;
  save(K_STATE,S);
}
function mastered(id){const s=S[id];return !!s && s.reps>=3 && s.iv>=6}
function dueList(){
  const now=Date.now();
  return ALL.filter(d=>{const s=S[d.id];return s&&s.reps>0&&s.due<=now}).sort((a,b)=>S[a.id].due-S[b.id].due);
}
function newList(limit){
  return ALL.filter(d=>{const s=S[d.id];return !s || s.seen===0}).slice(0,limit);
}

/* ============ TTS ============ */
let VOICES=[];
function loadVoices(){ try{VOICES=speechSynthesis.getVoices()||[]}catch(e){VOICES=[]} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(pref){
  if(!VOICES.length) loadVoices();
  for(const p of pref){ const v=VOICES.find(v=>v.lang && v.lang.toLowerCase().replace("_","-").startsWith(p)); if(v) return v; }
  return null;
}
/* 在线发音兜底：<audio> 播放不受 CORS 限制 */
let _audio=null;
function onlineSpeak(text, mode){
  try{
    if(!_audio) _audio=new Audio();
    const q=encodeURIComponent(text);
    const urls = mode==="zh"
      ? ["https://fanyi.baidu.com/gettts?lan=zh&text="+q+"&spd=3&source=web",
         "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q="+q]
      : ["https://dict.youdao.com/dictvoice?type=2&audio="+q,
         "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=la&q="+q];
    let i=0;
    const step=()=>{
      if(i>=urls.length){
        toast("此浏览器没有可用的语音引擎，在线发音也无法合成该词。可改用 Safari / Chrome 打开，或按卡片上的「中文近似读音」自己读。");
        return;
      }
      _audio.onerror=()=>{ i++; step(); };
      _audio.src=urls[i];
      const pr=_audio.play();
      if(pr&&pr.catch) pr.catch(()=>{ i++; step(); });
    };
    step();
  }catch(e){ toast("发音失败：当前浏览器不支持语音播放"); }
}
/* iOS(尤其"添加到主屏幕"的 Web App)需要一次用户手势预热语音引擎 */
let _warmed=false;
function warmUpTTS(){
  if(_warmed || !("speechSynthesis" in window)) return; _warmed=true;
  try{
    const u=new SpeechSynthesisUtterance(".");
    u.volume=0; u.lang="en-US"; u.rate=1;
    speechSynthesis.speak(u);
  }catch(e){}
}
document.addEventListener("pointerdown", ()=>{ loadVoices(); warmUpTTS(); }, {once:true, passive:true});
function speak(text, mode, manual){
  if(manual===undefined) manual=true;
  text=String(text||"").trim(); if(!text) return;
  if("speechSynthesis" in window){
    try{
      speechSynthesis.cancel();
      try{ speechSynthesis.resume(); }catch(e){}   // iOS 兼容
      const zh = mode==="zh";
      const u = new SpeechSynthesisUtterance(text);
      let v = pickVoice(zh?["zh","cmn"]:["la","it","en"]);
      if(!v && !VOICES.length){ loadVoices(); v=pickVoice(zh?["zh","cmn"]:["la","it","en"]); }
      if(v){ u.voice=v; u.lang=v.lang||(zh?"zh-CN":"en-US"); }   // lang 与 voice 保持一致，避免"有voice但静音"
      else { u.lang = zh?"zh-CN":"en-US"; }
      u.rate = zh?1:SET.rate;
      u.volume = 1;
      let started=false, failed=false;
      u.onstart=()=>{started=true};
      u.onerror=()=>{failed=true;};
      speechSynthesis.speak(u);
      if(!VOICES.length) setTimeout(loadVoices, 400);   // 语音列表异步加载，稍后补一次
      /* 双保险：浏览器"声称支持但没声音"时，300ms 后仍未开始 → 走在线发音 */
      if(manual){
        setTimeout(()=>{
          if(!started && !failed){
            try{ if(!speechSynthesis.speaking && !speechSynthesis.pending){ onlineSpeak(text,mode); } }catch(e){}
          }
        },300);
      }
      return;
    }catch(e){}
  }
  if(manual) onlineSpeak(text, mode);
}

/* ============ 学习队列 ============ */
let queue=[], qi=0, cur=null, flipped=false, curAnswered=false, _gradeSnap=null;

let CUR_BOOK = "全部";
function scopeList(){ return CUR_BOOK==="全部"? ALL : ALL.filter(d=>d.g===CUR_BOOK); }
function buildBookQueue(){
  today();
  const sub = scopeList();
  const now = Date.now();
  const due = sub.filter(d=>{const s=S[d.id];return s&&s.reps>0&&s.due<=now});
  const rest = Math.max(0, SET.newLimit - MISC.todayNew);
  const nw = sub.filter(d=>{const s=S[d.id];return !s||s.seen===0}).slice(0, rest);
  queue = due.concat(nw);
  if(SET.shuffle){ for(let i=queue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[queue[i],queue[j]]=[queue[j],queue[i]]} }
  qi = 0;
  const tag = document.getElementById("bookTag");
  if(tag) tag.textContent = CUR_BOOK==="全部"? "全部词书" : ("词书 · "+CUR_BOOK);
  renderStack();
  updateRing();
}
function buildQueue(){ CUR_BOOK="全部"; buildBookQueue(); }
function totalToday(){ return dueList().length + Math.max(0, SET.newLimit - MISC.todayNew); }

/* ============ 渲染卡片 ============ */
const stackEl = document.getElementById("stack");
function sylHTML(s){
  return (s||"").split("").length? s.split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part)) return part;
    return part.split("·").map(y=>{
      if(/^[A-Z]{2,}$/.test(y)) return "<b>"+y+"</b>";
      return y;
    }).join("·");
  }).join("") : "";
}
function phHTML(s){
  return (s||"").replace(/「([^」]+)」/g,"<b>$1</b>");
}
function cardHTML(d){

        '<div class="kv" style="margin-top:auto;padding-top:14px">'+(d.tag?'<span class="chip">'+esc(d.tag)+'</span>':'')+'<span class="chip">'+esc(d.g)+'</span>'+

}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function nl(s){return esc(s).replace(/\n/g,"<br>")}

function renderStack(){
  stackEl.innerHTML="";
  if(!queue.length){ renderDone(); return; }
  const idx = qi % queue.length;
  cur = queue[idx]; flipped=false; curAnswered=false;
  const ctrl=document.querySelector(".ctrl"); if(ctrl) ctrl.classList.remove("done");
  const nb=document.getElementById("nextRow"); if(nb) nb.classList.remove("show");
  const bw=document.getElementById("btnWrong"); if(bw){ bw.disabled=false; bw.textContent="✗ 记错了"; }
  _gradeSnap=null;
  const items = [cur, queue[(idx+1)%queue.length], queue[(idx+2)%queue.length]];
  items.forEach((d,i)=>{
    if(!d) return;
    const el = document.createElement("div");
    el.innerHTML = cardHTML(d);
    const c = el.firstChild;
    c.dataset.pos = i;
    layout(c, i);
    stackEl.appendChild(c);
  });
  const top = stackEl.querySelector('[data-pos="0"]');
  if(top && SET.autoSpeak) setTimeout(()=>speak(cur.la,"la",false),260);
  updateRing();
}
function layout(c,i){
  c.style.zIndex = 10-i;
  c.style.transform = i===0 ? "none" : "translateY("+(i*14)+"px) scale("+(1-i*0.055)+",1)";
  c.style.opacity = i>1?0.9:1;
  c.classList.remove("flip");
}
function renderDone(){
  stackEl.innerHTML = '<div class="card" style="transform:none"><div class="inner"><div class="face front" style="justify-content:center;align-items:center;text-align:center">'+
    '<div style="font-size:44px">🎉</div><div style="font-size:18px;font-weight:800;margin-top:10px">本轮已完成</div>'+
    '<div style="font-size:13px;color:var(--ink3);margin-top:8px;line-height:1.7">今日待复习 '+dueList().length+' 张，新卡上限 '+SET.newLimit+' 张<br>可继续练习或去词库挑重点</div>'+
    '<div style="margin-top:16px;display:flex;gap:9px">'+
      '<button class="btn pri" id="againBtn" style="max-width:150px">🔁 再来一轮</button>'+
      '<button class="btn" id="weakBtn" style="max-width:150px">📌 只刷薄弱项</button>'+
    '</div></div></div></div>';
  document.getElementById("againBtn").onclick=()=>buildQueue();
  document.getElementById("weakBtn").onclick=()=>{
    const w = ALL.filter(d=>{const s=S[d.id];return s&&s.wrong>s.right});
    queue = w.length? w : ALL.slice(0,20); qi=0; renderStack();
    toast(w.length?("薄弱项 "+w.length+" 张"):"暂无记录，随机练习");
  };
}

/* 拖拽 + 翻面（单套指针监听，避免重复绑定互相干扰） */
const DRAG={active:false,moved:false,sx:0,sy:0,dx:0,el:null};
stackEl.addEventListener("pointerdown",e=>{
  const sp=e.target.closest("[data-spk]"), fv=e.target.closest(".fav");
  if(sp||fv) return;                         // 让朗读/收藏按钮自己处理
  const top=stackEl.querySelector('[data-pos="0"]'); if(!top) return;
  DRAG.active=true; DRAG.moved=false; DRAG.el=top; DRAG.sx=e.clientX; DRAG.sy=e.clientY; DRAG.dx=0;
  top.classList.add("drag");
  try{ top.setPointerCapture(e.pointerId); }catch(_){}
});
window.addEventListener("pointermove",e=>{
  if(!DRAG.active) return;
  const dx=e.clientX-DRAG.sx, dy=e.clientY-DRAG.sy;
  if(Math.abs(dy)>Math.abs(dx)*1.4 && Math.abs(dy)>10){ DRAG.active=false; DRAG.el.classList.remove("drag"); DRAG.el.style.transform=""; layout(DRAG.el,0); restack(); return; }
  if(Math.abs(dx)>6||Math.abs(dy)>6) DRAG.moved=true;
  DRAG.dx=dx;
  DRAG.el.style.transform="translateX("+dx+"px) rotate("+(dx/22)+"deg)";
  stackEl.querySelectorAll(".card").forEach(c=>{ const p=+c.dataset.pos; if(p>0){ const t=Math.min(1,Math.abs(dx)/110); c.style.transform="translateY("+(p*14-7*t)+"px) scale("+(1-p*0.055+0.025*t)+",1)"; } });
});
window.addEventListener("pointerup",e=>{
  if(!DRAG.active) return;
  DRAG.active=false;
  const el=DRAG.el; el.classList.remove("drag");
  if(!DRAG.moved){ layout(el,0); restack(); flip(); return; }   // 轻点卡片 = 翻面
  if(DRAG.dx < -80) next(-1);
  else if(DRAG.dx > 80) prev();
  else { el.style.transform="translateX(0) rotate(0deg)"; restack(); }
});
function restack(){ stackEl.querySelectorAll(".card").forEach(c=>{ if(!c.classList.contains("drag")) layout(c,+c.dataset.pos); }); }
function flip(){
  const top = stackEl.querySelector('[data-pos="0"]');
  if(!top) return;
  flipped=!flipped; top.classList.toggle("flip",flipped);
}
function next(dir){
  const top = stackEl.querySelector('[data-pos="0"]');
  if(top){
    top.style.transition="transform .3s ease,opacity .3s ease";
    top.style.transform="translateX("+(dir<0?-520:520)+"px) rotate("+(dir<0?-18:18)+"deg)";
    top.style.opacity=0;
  }
  setTimeout(()=>{ qi++; if(qi>=queue.length){renderDone();updateRing();return;} renderStack(); },190);
}
function prev(){
  if(qi===0){ toast("已经是第一张"); const t=stackEl.querySelector('[data-pos="0"]'); if(t){t.style.transition="transform .25s";t.style.transform="translateX(0) rotate(0deg)"} return; }
  qi--; renderStack();
}

/* 标记 */
function revealAnswer(){
  const top=stackEl.querySelector('[data-pos="0"]'); if(!top) return;
  const a=top.querySelector(".ans"); if(a) a.classList.remove("hidden");
  const l=top.querySelector(".ans-lock"); if(l) l.classList.remove("show");
}
document.querySelectorAll(".ctrl .btn").forEach(b=>{
  b.addEventListener("click",()=>{
    if(!cur || curAnswered) return;
    const q = +b.dataset.g;
    const id = cur.id;
    /* 记录评分前的状态，供「记错了」还原 */
    _gradeSnap = { id:id, had:!!S[id], s:JSON.parse(JSON.stringify(S[id]||{})), newCount:MISC.todayNew };
    review(id,q);
    if(q<3){ queue.push(cur); }
    revealAnswer();
    curAnswered = true;
    const ctrl=document.querySelector(".ctrl"); if(ctrl) ctrl.classList.add("done");
    const row=document.getElementById("nextRow"); if(row) row.classList.add("show");
    const bw=document.getElementById("btnWrong");
    if(bw){
      if(q===0){ bw.disabled=true; bw.textContent="已记为不会"; }
      else { bw.disabled=false; bw.textContent="✗ 记错了"; }
    }
    const h=document.getElementById("hint"); if(h) h.textContent="已揭晓 · 记错了？点「✗ 记错了」改判，再点「下一张」继续";
  });
});
/* 记错了：还原本次评分，改记为不认识；不自动跳转 */
document.getElementById("btnWrong").onclick=()=>{
  const bw=document.getElementById("btnWrong");
  if(!cur || !curAnswered || bw.disabled) return;
  const id=cur.id;

/* ============ 联网识别（NCBI Taxonomy） ============ */
const RANK_ZH={species:"种",genus:"属",family:"科",order:"目",class:"纲",phylum:"门","superclass":"总纲",kingdom:"界",domain:"域",strain:"株",subspecies:"亚种",subfamily:"亚科",tribe:"族",subgenus:"亚属",variety:"变种",form:"变型","no rank":"未定级"};
let _onlineBusy=false;
/* AI 通用调用（OpenAI 兼容接口） */
async function aiChat(user, sys){
  const ai=SET.ai; if(!ai||!ai.on||!ai.key||!ai.base||!ai.model) return null;
  const base=ai.base.replace(/\/+$/,"");
  const body=JSON.stringify({model:ai.model, temperature:0.3, messages:[
    {role:"system",content:sys||"你是严谨的微生物学专家，只输出 JSON。"},
    {role:"user",content:user}]});
  const r=await fetch(base+"/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+ai.key}, body});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j=await r.json();
  const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
  const m=txt.match(/\{[\s\S]*\}/); if(!m) return null;
  return JSON.parse(m[0]);
}
/* AI 翻译：中文名 + 特征 + 用途 + 记忆点（和内置卡片同结构） */
async function aiTranslate(sci, lin, wikiEn){
  const o = await aiChat(
    "微生物拉丁学名："+sci+"\n分类谱系："+(lin||"")+(wikiEn?("\n英文简介："+wikiEn):"")+
    "\n请只输出严格 JSON（不要任何多余文字）：{\"zh\":\"标准中文名（教材常用译名；没有则音译或留空）\",\"ph\":\"按拉丁读音规则写中文近似读音，重读音节用「」标出，如 阿斯科「佩」尔吉鲁斯\",\"feat\":\"是什么/特征：2-4 句中文，教材风格写形态与生理特征\",\"use\":\"有什么作用/用途：1-3 句中文（发酵、产酶、致病、模式生物等）\",\"tip\":\"记忆点：一句联想口诀，可无\"}");
  if(!o) return null;
  return {zh:(o.zh||"").trim(), ph:(o.ph||"").trim(), feat:(o.feat||"").trim(), use:(o.use||"").trim(), tip:(o.tip||"").trim()};
}
/* AI 把中文/英文俗名翻译成拉丁学名 */
async function aiToLatin(q){
  const o = await aiChat(
    "用户输入了一个名称（可能是中文俗名、英文俗名或拼错的拉丁名）：\""+q+"\"\n"+
    "请给出最可能对应的微生物拉丁学名。只输出严格 JSON：{\"latin\":\"属名+种加词或属名\",\"zh\":\"中文名\"}。若没有对应的微生物，输出 {\"latin\":\"\",\"zh\":\"\"}");
  if(!o) return null;
  return {latin:(o.latin||"").trim(), zh:(o.zh||"").trim()};
}
async function onlineLookup(raw){
  const q=(raw||document.getElementById("q").value).trim();
  if(!q){ toast("输入名称即可查：拉丁 / 中文 / 英文都行"); document.getElementById("q").focus(); return; }

  const box=document.getElementById("list");
  let aiRes=null;
  const aiOn = !!(SET.ai&&SET.ai.on&&SET.ai.key&&SET.ai.base&&SET.ai.model);
  box.innerHTML='<div class="empty">🌐 正在 NCBI 分类库联网识别「'+esc(q)+'」…<br><span style="font-size:12px;color:var(--ink3)">需要联网，请稍候</span></div>';
  try{
    const eu="https://eutils.ncbi.nlm.nih.gov/entrez/eutils/";
    const es=async term=>{ const s=await fetch(eu+"esearch.fcgi?db=taxonomy&term="+encodeURIComponent(term)+"&retmode=json&retmax=5"); const sj=await s.json(); return sj.esearchresult&&sj.esearchresult.idlist; };
    let ids=await es(q), viaAi=null;
    if((!ids||!ids.length)&&aiOn){

          const t=ex.length>260?ex.slice(0,260)+"…":ex;
          const wb=document.getElementById("wikiBox"); const wt=document.getElementById("wikiTxt");
          if(wb&&wt){ wt.textContent=t; wb.style.display=""; } break; } }
      }).catch(()=>{});
  }catch(e){
    box.innerHTML='<div class="empty">联网失败：'+esc(e&&e.message?e.message:String(e))+'<br>请检查网络后重试</div>';
  }finally{ _onlineBusy=false; }
}
function guessGroup(div,lin){
  const t=((div||"")+" "+(lin||"")).toLowerCase();
  if(t.includes("virus")) return "病毒";
  if(t.includes("archae")) return "古菌";
  if(t.includes("cyanobact")||t.includes("blue-green")) return "蓝细菌";
  if(t.includes("alga")) return "藻类";
  if(t.includes("fungi")||t.includes("ascomycet")||t.includes("basidiomycet")||t.includes("yeast")) return "霉菌";
  if(t.includes("bacter")) return "细菌";
  return "细菌";
}

document.getElementById("fileIn").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    if(e.target.dataset.type==="json"){
      try{
        const o=JSON.parse(r.result);
        if(o.state) S=o.state; if(o.custom) CUSTOM=o.custom; if(o.set) SET=Object.assign(SET,o.set); if(o.misc) MISC=o.misc;
        save(K_STATE,S);save(K_CUSTOM,CUSTOM);save(K_SET,SET);save(K_MISC,MISC);
        rebuild(); refresh(); toast("导入成功");
      }catch(err){ toast("文件格式错误") }
    } else {
      const rows=parseCSV(r.result);
      let n=0;
      rows.forEach(c=>{
        const la=c[0],zh=c[1];
        if(!la||!zh) return;
        CUSTOM.push({id:"c"+Date.now()+n, la:la, zh:zh, g:GKEYS.indexOf(c[2])>=0?c[2]:"细菌",
          tag:c[3]||"", syl:c[4]||"", ph:c[5]||"", fe:c[6]||"", us:c[7]||"", mn:c[8]||"", custom:1});
        n++;
      });
      save(K_CUSTOM,CUSTOM); rebuild(); refresh(); toast("导入 "+n+" 条词条");
    }
    e.target.value="";
  };
  r.readAsText(f,"utf-8");
};
function parseCSV(txt){
  const rows=[]; let row=[],cur="",q=false;
  txt=txt.replace(/^\uFEFF/,"");
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){cur+='"';i++} else q=false } else cur+=ch }
    else{ if(ch==='"') q=true; else if(ch===','){row.push(cur);cur=""} else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur=""} else if(ch!=="\r") cur+=ch }
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c && c.trim()));
}
